name: Regenerate Supabase types

# Web ARCHITECTURE_AUDIT.md Strategy 4 — close the type-drift gap.
#
# Current state: src/integrations/supabase/types.ts is generated by
# `supabase gen types typescript`, but regeneration is manual. After
# every schema migration somebody has to remember to run it. They
# usually don't, which is why the codebase has 131 `as any` casts
# routing around stale types.
#
# This workflow:
#   - Triggers on any push to main that changes `supabase/migrations/**`
#     (the trigger for schema-changing PRs landing).
#   - Also exposes manual dispatch for ad-hoc refreshes.
#   - Regenerates types.ts against the live Supabase schema.
#   - If the file changed, opens a PR titled
#     "chore(types): regenerate Supabase types" against main.
#
# Required GitHub repository secrets:
#   SUPABASE_ACCESS_TOKEN  — an access token from
#     https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — project ref (e.g. oltzgidkjxwsukvkomof)
#
# Note: the workflow uses GITHUB_TOKEN (provided automatically) to
# open PRs. Repo settings must allow Actions to create pull requests
# (Settings → Actions → General → Workflow permissions).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to push the branch
      pull-requests: write  # to open the PR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            > src/integrations/supabase/types.ts
          # The generated file should always have content; fail loudly if not.
          if [ ! -s src/integrations/supabase/types.ts ]; then
            echo "::error::Generated types.ts is empty. Check SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_ID."
            exit 1
          fi

      - name: Open PR if file changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(types): regenerate Supabase types'
          title: 'chore(types): regenerate Supabase types'
          body: |
            Auto-regenerated `src/integrations/supabase/types.ts`
            against the current Supabase schema.

            Triggered by: ${{ github.event_name == 'push' && 'migration push' || 'manual workflow dispatch' }}
            Trigger SHA: ${{ github.sha }}

            See [`ARCHITECTURE_AUDIT.md` Strategy 4](../blob/main/ARCHITECTURE_AUDIT.md#strategy-4--auto-regenerate-supabase-types-in-ci).
          branch: chore/regen-supabase-types
          delete-branch: true
          base: main
